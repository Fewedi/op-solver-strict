activeProfile: gurobiRun

profiles:
    clusterInvestigation:
        mode: PARAMETERSEARCH
        analysis:
            resultPath: "results/clusterflat"
        bothRevenueDistribution: false
        runs: 1
        parameterTuning:
            parameter: clusterEliminationThreshold
            startValue: 0.30
            endValue: 0.90
            stepSize: 0.1
        instance:
            origin: ref
            testSet: base
            budgetFactor: 1.0
            revenueDistribution: random
        algorithm:
            solver: gurobi
            clusterConnector: op
            tspCostMatrix: makeSymmetric  # Possible values: makeSymmetric, nothing
            clusterElimination: none
            clustering: KMEANSSPLIT
            clusteringStatistic: MEAN
            budgetDistribution: elzein # considerClusterMean, considerClusterMedian, considerClusterMeanAndMedian, considerClusterMeanAndMedianWithOutliers, considerClusterMeanAndMedianWithOutliersAndOutliers, considerClusterMeanAndMedianWithOutliersAndOutliersAndClusterSize
            budgetMinCalculation: MIN # Possible values: MIN, CENTER, NONE
            useMaxBudget: true
            gurobi:
                clusterStartNode: mean
        parameter:
            clusterEliminationThreshold: 0.6
            clusterEliminationRevenueWeight: 0.5
            clusterEliminationSparsityWeight: 0.5
            maxBudgetFactor: 0.712
            budgetWeight: 0.2
            clusterSize: 25

    gurobiRun:
        mode: RUN  # Possible values: RUN, PARAMETERSEARCH, COMPARERESULTS
        analysis:
            resultPath: "results/budget/comparison"
        bothRevenueDistribution: false
        runs: 10
        parameterTuning:
            parameter: budgetWeight
            startValue: 0.2
            endValue: 0.8
            stepSize: 0.2
        instance:
            origin: ref # Possible values: REF, OPLIB
            testSet: ONE  # Possible values: ONE, HARD, BASE
            budgetFactor: 1.0
            revenueDistribution: random  # Possible values: RANDOM, FLAT
        algorithm:
            solver: gurobi  # Possible values: gurobi, ea4op
            clusterConnector: OP  # Possible values: TSP, OP
            tspCostMatrix: makeSymmetric  # Possible values: makeSymmetric, nothing
            clusterElimination: none  # Possible values: LAST, DISTANCE, SPARSITY, NONE
            clustering: KMEANSUPPERBOUNDIGNOREOUTLIERS  # Possible values: KMEANS, KMEANSUPPERBOUNDIGNOREOUTLIERS, KMEANSSPLIT, KMEANSFLOW deprecated: KMEANSCAPACITATED, KMEANSCAPACITATEDCUSTOM, KMEANSANDCORRECTLATER, KMEANSUPPERBOUND
            clusteringStatistic: MEDIAN # Possible values: MEAN, MEDIAN
            budgetDistribution: ELZEIN # Possible values: ELZEIN, CONSIDERSPARSENESS, CONSIDERDETOUR, NAIVE
            budgetMinCalculation: center # Possible values: MIN, CENTER, NONE
            useMaxBudget: false
            gurobi:
                clusterStartNode: mean  # Possible values: MEAN, MEDIAN, NONE
        parameter:
            clusterEliminationThreshold: 0.5
            clusterEliminationRevenueWeight: 0.25
            clusterEliminationSparsityWeight: 0.5
            maxBudgetFactor: 0.6
            budgetWeight: 0.6
            clusterSize: 25
