activeProfile: gurobiWithFixedEndPoints

profiles:
    oneStartPoint: # not feasible for ea4op
        runs: 1
        testSet: one
        solver: ea4op
        ea4op:
            startEntries: 1
            dummyStartNode: none
            dummyStartNodeMethod: none
            dummyStartNodeFactor: 0.0
        clustering: kmeans
        budgetDistribution: elzein
        revenueDistribution: random
        clusterSize: 20
    noStartPoints:
        runs: 1
        testSet: one
        solver: ea4op
        ea4op:
            startEntries: 0
            dummyStartNode: none
            dummyStartNodeMethod: none
            dummyStartNodeFactor: 0.0
        clustering: kmeans
        budgetDistribution: elzein
        revenueDistribution: random
        clusterSize: 20
    dummyStartNodeCluster: # dummy start node = previous cluster
        runs: 1
        testSet: one
        solver: ea4op
        ea4op:
            startEntries: 0
            dummyStartNode: cluster
            dummyStartNodeMethod: mean
            dummyStartNodeFactor: 2.0
        clustering: kmeans
        budgetDistribution: elzein
        revenueDistribution: random
        clusterSize: 20
    gurobiWithFixedEndPoints:
        runs: 3
        testSet: base
        solver: gurobi
        gurobi:
            clusterStartNode: mean
        clustering: KmeansUpperBoundIgnoreOutliers
        budgetDistribution: elzeinwithmin
        revenueDistribution: random
        clusterSize: 24