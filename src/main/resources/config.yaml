activeProfile: gurobiRun

profiles:
    clusterInvestigation:
        mode: PARAMETERSEARCH
        analysis:
            resultPath: "results/budget/comparison"
        bothRevenueDistribution: false
        runs: 1
        parameterTuning:
            parameter: clusterEliminationThreshold
            startValue: 0.30
            endValue: 0.90
            stepSize: 0.1
        instance:
            origin: ref
            testSet: base
            budgetFactor: 0.7
            revenueDistribution: random
        algorithm:
            solver: gurobi
            clusterConnector: op
            tspCostMatrix: makeSymmetric
            clusterElimination: none
            clustering: KMEANSSPLIT
            clusteringStatistic: MEAN
            budgetDistribution: elzein
            budgetMinCalculation: MIN
            useMaxBudget: true
            gurobi:
                clusterStartNode: mean
        parameter:
            clusterEliminationThreshold: 0.6
            clusterEliminationRevenueWeight: 0.5
            clusterEliminationSparsityWeight: 0.5
            maxBudgetFactor: 0.712
            budgetWeight: 0.2
            clusterSize: 25

    gurobiRun:
        mode: RUN  # Possible values: RUN, PARAMETERSEARCH
        analysis:
            resultPath: "results/budget/comparison"
        bothRevenueDistribution: false # deprecated
        runs: 5
        parameterTuning: # only relevant for PARAMETERSEARCH
            parameter: budgetWeight # Possible values: clusterEliminationThreshold, clusterEliminationRevenueWeight, clusterEliminationSparsityWeight, maxBudgetFactor, budgetWeight, clusterSize
            startValue: 2.0
            endValue: 7.0
            stepSize: 1.0
        instance:
            origin: ref # Possible values: REF, OPLIB
            testSet: BASE  # Possible values: ONE, HARD, BASE
            budgetFactor: 1.0
            revenueDistribution: flat # Possible values: RANDOM, FLAT
        algorithm:
            solver: gurobi  # Possible values: gurobi
            clusterConnector: OP  # Possible values: TSP, OP
            tspCostMatrix: makeSymmetric  # Possible values: makeSymmetric, nothing
            clusterElimination: NONE  # Possible values: LAST, DISTANCE, SPARSITY, NONE
            clustering: KMEANSFLOW  # Possible values: KMEANS, KMEANSUPPERBOUNDIGNOREOUTLIERS, KMEANSSPLIT, KMEANSFLOW deprecated: KMEANSCAPACITATED, KMEANSCAPACITATEDCUSTOM, KMEANSANDCORRECTLATER, KMEANSUPPERBOUND
            clusteringStatistic: MEAN # Possible values: MEAN, MEDIAN
            budgetDistribution: naive # Possible values: ELZEIN, CONSIDERSPARSENESS, CONSIDERDETOUR, NAIVE
            budgetMinCalculation: center # Possible values: MIN, CENTER, NONE
            useMaxBudget: false
            gurobi:
                clusterStartNode: mean  # Possible values: MEAN
        parameter:
            clusterEliminationThreshold: 0.5
            clusterEliminationRevenueWeight: 0.25
            clusterEliminationSparsityWeight: 0.5
            maxBudgetFactor: 0.7 # relevant for useMaxBudget
            budgetWeight: 0.6 # relevant for CONSIDERSPARSENESS
            clusterSize: 25